format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

# Self-test workflows for this step, run on a real Bitrise machine.
#
# This is the gate before a marketplace submission: the local suite covers
# everything below the npm install, but only a hosted build proves the
# install itself, PATH resolution after `npm i -g`, envman output export,
# and $BITRISE_DEPLOY_DIR artifact pickup.
#
# Run locally with the Bitrise CLI:   bitrise run test
# Or point a Bitrise app at this repo and run the `test` workflow.

app:
  envs:
    - APPFLIGHT_VERSION: 0.12.0
    # Free deterministic scanning needs no account. Leave telemetry off so a
    # CI self-test never emits usage events.
    - APPFLIGHT_TELEMETRY: "0"

workflows:
  audit-this-step:
    steps:
      - script:
          title: Audit marketplace metadata
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                stepman audit --step-yml ./step.yml

  # Expected: PASSES. Clean fixture, nothing at or above the threshold.
  test-clean:
    steps:
      - path::./:
          title: Appflight — clean fixture (expect pass)
          inputs:
            - project_path: ./test/fixtures/clean-app
            - appflight_version: $APPFLIGHT_VERSION
            - fail_on: critical
            - deep: "false"
      - script:
          title: Assert outputs were exported
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                echo "APPFLIGHT_FINDING_COUNT = ${APPFLIGHT_FINDING_COUNT:-<unset>}"
                echo "APPFLIGHT_REPORT_PATH   = ${APPFLIGHT_REPORT_PATH:-<unset>}"
                [ "${APPFLIGHT_FINDING_COUNT:-}" = "0" ] || { echo "expected 0 findings"; exit 1; }
                [ -s "${APPFLIGHT_REPORT_PATH:-/nonexistent}" ] || { echo "no report artifact"; exit 1; }
                echo "OK — outputs exported and artifact written"

  # Expected: FAILS with exit 1. This workflow failing is the CORRECT result;
  # the report-only variant below is what proves the artifact still lands.
  test-gate-fires:
    steps:
      - script:
          title: Write the fixture credential at runtime
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                # Assembled here so no secret-shaped literal is ever committed.
                prefix="sk_live"
                body="A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6"
                mkdir -p ./test/fixtures/critical-app/Sources
                cat > ./test/fixtures/critical-app/Sources/Configuration.swift <<SWIFT
                import Foundation

                enum Configuration {
                    static let paymentSecret = "${prefix}_${body}"
                    static let apiBaseURL = URL(string: "https://api.example.com")!
                }
                SWIFT
      - path::./:
          title: Appflight — critical fixture (expect build failure)
          inputs:
            - project_path: ./test/fixtures/critical-app
            - appflight_version: $APPFLIGHT_VERSION
            - fail_on: critical
            - deep: "false"

  # Expected: PASSES. Same critical fixture, report-only, so the build stays
  # green while the artifact still records the finding.
  test-report-only:
    steps:
      - script:
          title: Write the fixture credential at runtime
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                prefix="sk_live"
                body="A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6"
                mkdir -p ./test/fixtures/critical-app/Sources
                cat > ./test/fixtures/critical-app/Sources/Configuration.swift <<SWIFT
                import Foundation

                enum Configuration {
                    static let paymentSecret = "${prefix}_${body}"
                    static let apiBaseURL = URL(string: "https://api.example.com")!
                }
                SWIFT
      - path::./:
          title: Appflight — critical fixture, report-only
          inputs:
            - project_path: ./test/fixtures/critical-app
            - appflight_version: $APPFLIGHT_VERSION
            - fail_on: none
            - deep: "false"
      - script:
          title: Assert the finding was recorded without failing the build
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                echo "APPFLIGHT_FINDING_COUNT = ${APPFLIGHT_FINDING_COUNT:-<unset>}"
                [ "${APPFLIGHT_FINDING_COUNT:-0}" -ge 1 ] || { echo "expected >=1 finding"; exit 1; }
                grep -q '"critical": 1' "${APPFLIGHT_REPORT_PATH}" \
                  || { echo "critical finding missing from artifact"; exit 1; }
                echo "OK — finding recorded, build stayed green"

  # Expected: FAILS fast, before any npm install.
  test-misconfigured:
    steps:
      - path::./:
          title: deep without a token (expect immediate failure)
          inputs:
            - project_path: ./test/fixtures/clean-app
            - appflight_version: $APPFLIGHT_VERSION
            - fail_on: critical
            - deep: "true"
            - api_token: ""

  # Expected: PASSES. Hosted proof of --prove-billing on a real Play app.
  # RetroMusicPlayer at a pinned revision resolves Play Billing 7.0.0 (deadline
  # 2026-08-31). The step compiles the release build, proves the Billing
  # classes, and must report the deprecation as CRITICAL with Billing coverage
  # "evaluated". Report-only so the CRITICAL is asserted, not used as the gate.
  # form_factors is required for target API to be evaluated (Appflight never
  # assumes a phone release); mode defaults to submission.
  test-prove-billing-retro:
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
    envs:
      - RETRO_REPOSITORY: https://github.com/RetroMusicPlayer/RetroMusicPlayer.git
      - RETRO_REVISION: 09ddc3deb4646bb26c755ce1d3fd3587c9604f74
      - RETRO_DIR: $BITRISE_SOURCE_DIR/_retro
      # A cold worker resolves Retro's dependencies inside the facts build.
      - APPFLIGHT_GRADLE_TIMEOUT_MS: "1200000"
    steps:
      - nvm@1:
          inputs:
            - node_version: "22.23.1"
      # Retro compiles with source/target Java 21 (LibreTorrent runs on 17).
      - set-java-version@1:
          inputs:
            - set_java_version: "21"
      - script:
          title: Fetch RetroMusicPlayer at its pinned revision
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                sdkmanager "platforms;android-36" "build-tools;36.0.0"
                rm -rf "$RETRO_DIR"
                git init -q "$RETRO_DIR"
                git -C "$RETRO_DIR" fetch -q --depth 1 "$RETRO_REPOSITORY" "$RETRO_REVISION"
                git -C "$RETRO_DIR" checkout -q --detach FETCH_HEAD
                test "$(git -C "$RETRO_DIR" rev-parse HEAD)" = "$RETRO_REVISION"
                chmod u+x "$RETRO_DIR/gradlew"
      - path::./:
          title: Appflight — Retro with --prove-billing (expect Billing CRITICAL)
          inputs:
            - project_path: $RETRO_DIR
            - platform: android
            - android_module: ":app"
            - android_variant: normalRelease
            - distribution: google_play
            - form_factors: phone
            - allow_gradle_network: "true"
            - prove_billing: "yes"
            - billing_closure_timeout_minutes: "30"
            - appflight_version: $APPFLIGHT_VERSION
            - fail_on: none
            - deep: "false"
      - script:
          title: Assert the Billing CRITICAL and evaluated Billing coverage
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                node -e '
                  const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
                  const id = "android.billing_library_deprecation";
                  const row = r.coverage?.rules?.[id];
                  const hits = (r.findings || []).filter((f) => (f.rule?.id ?? f.id) === id && f.severity === "CRITICAL");
                  console.log("billing coverage:", row?.status, row?.reasonCode);
                  hits.forEach((f) => console.log("finding:", f.severity, f.title));
                  if (row?.status !== "evaluated") { console.error("Billing coverage is not evaluated"); process.exit(1); }
                  if (hits.length !== 1) { console.error("expected exactly one Billing CRITICAL"); process.exit(1); }
                  console.log("OK — Billing proven and reported as CRITICAL");
                ' "${APPFLIGHT_REPORT_PATH:?no report artifact}"
      - deploy-to-bitrise-io@2: {}

  # Hosted verification carried over from the 0.3.0 release checks
  # (dist/release-handoff/bitrise-0.3.0-hosted-tests.yml in AppScan), updated
  # for 0.4.0: this branch's step, the pinned CLI from APPFLIGHT_VERSION, and
  # form factors through the form_factors input instead of a policy file.
  # Both expect the step to FAIL the build on a CRITICAL; the always-run
  # verification step is what proves the expected finding.
  verify-appflight-ios:
    steps:
      - nvm@1:
          inputs:
            - node_version: "22.23.1"
      - script@1:
          title: Clone pinned IceCubesApp
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                project_dir="$(mktemp -d)/IceCubesApp"
                git init "$project_dir"
                git -C "$project_dir" remote add origin https://github.com/Dimillian/IceCubesApp.git
                git -C "$project_dir" fetch --depth 1 origin 9c05a720597b3ff13de2e241bf58d3fba0863c09
                git -C "$project_dir" checkout --detach FETCH_HEAD
                test "$(git -C "$project_dir" rev-parse HEAD)" = 9c05a720597b3ff13de2e241bf58d3fba0863c09
                envman add --key APPFLIGHT_TEST_PROJECT --value "$project_dir"
      - path::./:
          title: IceCubesApp — expect CRITICAL gate failure
          inputs:
            - project_path: "$APPFLIGHT_TEST_PROJECT"
            - platform: "ios"
            - appflight_version: $APPFLIGHT_VERSION
            - fail_on: "critical"
            - deep: "false"
            - api_token: ""
      - script@1:
          title: Verify expected iOS finding despite incomplete analysis
          is_always_run: true
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                node <<'NODE'
                const assert = require('node:assert/strict');
                const fs = require('node:fs');
                const r = JSON.parse(fs.readFileSync(process.env.APPFLIGHT_REPORT_PATH, 'utf8'));
                assert.equal(r.tool.version, process.env.APPFLIGHT_VERSION);
                assert.equal(r.schemaVersion, '1.9');
                assert.equal(r.platform, 'ios');
                assert.equal(r.gate.triggered, true);
                assert.ok(r.findings.some(f => f.id === 'code_required_reason_apis_undeclared' && f.severity === 'CRITICAL'));
                assert.equal(r.verdict, 'not_fully_evaluated');
                assert.notEqual(process.env.APPFLIGHT_EVALUATION_STATUS, 'complete');
                assert.equal(process.env.APPFLIGHT_VERDICT, r.verdict);
                console.log('EXPECTED IOS POSITIVE VERIFIED: code_required_reason_apis_undeclared CRITICAL; incomplete analysis retained.');
                NODE
      - deploy-to-bitrise-io@2:
          is_always_run: true

  verify-appflight-android:
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
    envs:
      - APPFLIGHT_GRADLE_TIMEOUT_MS: "1200000"
    steps:
      - nvm@1:
          inputs:
            - node_version: "22.23.1"
      - set-java-version@1:
          inputs:
            - set_java_version: "17"
      - script@1:
          title: Verify JDK/SDK and clone pinned LibreTorrent
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                java -version
                javac -version
                test -x "${JAVA_HOME:?JAVA_HOME must point to a JDK}/bin/javac"
                test -d "${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK is required}}"
                sdkmanager "platforms;android-36" "build-tools;36.0.0"
                project_dir="$(mktemp -d)/LibreTorrent"
                git init "$project_dir"
                git -C "$project_dir" remote add origin https://github.com/proninyaroslav/libretorrent.git
                git -C "$project_dir" fetch --depth 1 origin ae96f20b9852d2140fd704a3f2451ed7679e35a0
                git -C "$project_dir" checkout --detach FETCH_HEAD
                test "$(git -C "$project_dir" rev-parse HEAD)" = ae96f20b9852d2140fd704a3f2451ed7679e35a0
                git -C "$project_dir" submodule update --init --recursive
                chmod +x "$project_dir/gradlew"
                envman add --key APPFLIGHT_TEST_PROJECT --value "$project_dir"
      - path::./:
          title: LibreTorrent — expect target API gate failure
          inputs:
            - project_path: "$APPFLIGHT_TEST_PROJECT"
            - platform: "android"
            - android_module: ":app"
            - android_variant: "playRelease"
            - distribution: "google_play"
            - form_factors: "phone"
            - allow_gradle_network: "true"
            - appflight_version: $APPFLIGHT_VERSION
            - fail_on: "critical"
            - deep: "false"
            - api_token: ""
      - script@1:
          title: Verify target API actually evaluated and fired
          is_always_run: true
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                node <<'NODE'
                const assert = require('node:assert/strict');
                const fs = require('node:fs');
                const r = JSON.parse(fs.readFileSync(process.env.APPFLIGHT_REPORT_PATH, 'utf8'));
                assert.equal(r.tool.version, process.env.APPFLIGHT_VERSION);
                assert.equal(r.schemaVersion, '1.9');
                assert.equal(r.platform, 'android');
                assert.equal(r.gate.triggered, true);
                // The rule row, not the overall verdict: Android reports are always
                // not_fully_evaluated because only part of the tree is scanned.
                const rule = r.coverage.rules['android.target_api'];
                assert.equal(rule.status, 'evaluated');
                assert.equal(rule.reasonCode, 'evidence_available');
                assert.equal(rule.result, 'findings');
                assert.equal(rule.distribution, 'google_play');
                assert.equal(rule.release.module, ':app');
                assert.equal(rule.release.variant, 'playRelease');
                assert.ok(rule.assessments.some(a => a.surface === 'phone' && a.status === 'evaluated' && a.actual === 35 && a.required === 36 && a.result === 'findings'));
                assert.ok(r.findings.some(f => f.id === 'android.target_api' && f.severity === 'CRITICAL'));
                console.log('TARGET API VERIFIED: evaluated / evidence_available; :app:playRelease targets 35, requires 36; CRITICAL.');
                console.log('Overall analysis verdict:', r.verdict, '(independent of target-API rule evaluation)');
                NODE
      - deploy-to-bitrise-io@2:
          is_always_run: true

  # The suite a reviewer should run first.
  test:
    after_run:
      - test-clean
      - test-report-only
